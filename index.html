<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Construtora JR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">JR</div>
      <div>
        <h1 id="empresaNome">Construtora JR</h1>
        <small id="hojeLabel"></small>
      </div>
    </div>
    <button class="icon-btn" data-act="goTab" data-tab="config" title="Configurações">⚙️</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-act="goTab" data-tab="agenda">📅<span>Agenda</span></button>
    <button data-act="goTab" data-tab="faturamento">💰<span>Faturamento</span></button>
    <button data-act="goTab" data-tab="combustivel">⛽<span>Combustível</span></button>
    <button data-act="goTab" data-tab="orcamentos">🧾<span>Orçamentos</span></button>
    <button data-act="goTab" data-tab="funcionarios">👷<span>Pagamentos</span></button>
    <button data-act="goTab" data-tab="gastos">📉<span>Gastos</span></button>
    <button data-act="goTab" data-tab="empreitadas">🔨<span>Empreitada</span></button>
  </nav>

  <main id="view"></main>

  <div class="modal-bg" id="modalBg" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" data-act="closeModal">✕</button>
      </div>
      <form id="modalForm"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a2e">
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("construtora-jr-v1:tema")==="claro"?"claro":"escuro"}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JR Construções">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <title>JR Construções</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.13.0">
</head>
<body>
  <div class="splash" id="splash"><img src="img/logo.jpg" alt="JR Construções — Sua obra em boas mãos"></div>
  <div class="login" id="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <img src="img/logo.jpg" alt="JR Construções — Sua obra em boas mãos">
      <h2>Entrar</h2>
      <label>E-mail</label><input name="email" type="email" required autocomplete="username" inputmode="email">
      <label>Senha</label><input name="senha" type="password" required autocomplete="current-password">
      <p class="login-erro" id="loginErro" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">O acesso é criado pelo administrador.</p>
    </form>
  </div>
  <header class="topbar">
    <img class="logo" src="img/logo-topo.jpg" alt="JR Construções — Sua obra em boas mãos">
    <h1 id="empresaNome" class="sr-only">JR Construções</h1>
    <div class="top-info">
      <label class="cidade-sel" title="Escolher a cidade"><span>📍</span><select id="cidadeSel" data-change="trocarCidade" aria-label="Cidade"></select></label>
      <small id="hojeLabel"></small>
      <span class="ver" id="verLabel" data-act="goTab" data-tab="config"></span>
    </div>
    <button class="btn sm install-btn" id="btnInstalar" data-act="instalarApp" hidden>📲 Instalar app</button>
    <button class="icon-btn" id="btnTema" data-act="trocarTema" title="Mudar tema">☀️</button>
    <button class="icon-btn" data-act="goTab" data-tab="config" title="Configurações">⚙️</button>
  </header>

  <div class="update-bar" id="updateBar" hidden>
    <span>🚀 Nova versão <b id="novaVer"></b> disponível</span>
    <button class="btn sm" data-act="atualizarApp">Atualizar agora</button>
  </div>

  <div class="install-bar" id="installBar" hidden>
    <img src="img/icon-192.png" alt="">
    <div class="install-txt"><b>Use como aplicativo</b><span id="installMsg">Instale o JR Construções na tela inicial e abra sem a barra do navegador.</span></div>
    <button class="btn sm" data-act="instalarApp">Instalar</button>
    <button class="icon-btn" data-act="fecharInstalar" title="Agora não">✕</button>
  </div>

  <nav class="tabs" id="tabs">
    <button data-act="goTab" data-tab="cidades">🌎<span>Todas as cidades</span></button>
    <button data-act="goTab" data-tab="agenda">🏗️<span>Obras</span></button>
    <button data-act="goTab" data-tab="faturamento">💰<span>Faturamento</span></button>
    <button data-act="goTab" data-tab="combustivel">⛽<span>Vale</span></button>
    <button data-act="goTab" data-tab="orcamentos">🧾<span>Orçamentos</span></button>
    <button data-act="goTab" data-tab="equipe">👷<span>Funcionários</span></button>
    <button data-act="goTab" data-tab="funcionarios">💵<span>Pagamentos</span></button>
    <button data-act="goTab" data-tab="gastos">📉<span>Gastos</span></button>
    <button data-act="goTab" data-tab="empreitadas">🔨<span>Empreitada</span></button>
  </nav>

  <main id="view"></main>

  <div class="modal-bg" id="modalBg" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" data-act="closeModal">✕</button>
      </div>
      <form id="modalForm"></form>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js?v=1.13.0"></script>
</body>
</html>
